<script>
(function(){
"use strict";
const {fmt,pick,mi,sb,KE,viz}=HL;

/* ===== Sets 1-2 (converted from the first single-page version) ===== */
const OLD=(function(){
const {fmt,pick,mi,up,sb,ssp,OP,FR,SQ,EQ,CALC,HALF,sq2,neg,IMPLIES,PI,OMEGA,V0,VI,VF,KE,KEI,KEF,DKE,legend,steps,checkline,finalAns,watch,calcTip}=HL;
const FFR=sb(mi("F"),"fr");
const QS=[
{
  id:"q1", set:1, topic:"Kinematics", hw:"Builds toward HW 2",
  base:{v0:4,a:1.5,t:6},
  random:()=>({v0:pick([2,3,4,5,6]),a:pick([0.5,1.5,2,2.5,3]),t:pick([4,5,6,8,10])}),
  calc:p=>({gain:p.a*p.t,v:p.v0+p.a*p.t}),
  text:(p,G,T)=>`A cyclist is riding at ${G("v0",`${p.v0} m/s`)}. She then speeds up with a ${T("acc","constant acceleration")} of ${G("a",`${p.a} m/s²`)} for ${G("t",`${p.t} s`)}. What is her speed at the end?`,
  terms:{acc:["Constant acceleration",`Acceleration is how much the speed changes every second. "Constant" means it changes by the same amount every second. For example, 2 m/s² means the speed goes up by 2 m/s each second.`]},
  given:p=>[
    {k:"v0",sym:V0,name:"starting speed",unit:"m/s",val:p.v0,why:`Her speed at the very beginning. The small 0 means "at time zero".`},
    {k:"a",sym:mi("a"),name:"acceleration",unit:"m/s²",val:p.a,why:`How much speed she gains every second. Read the unit as "metres per second, every second".`},
    {k:"t",sym:mi("t"),name:"time",unit:"s",val:p.t,why:"How long she keeps speeding up."}
  ],
  find:[{sym:mi("v"),name:"final speed",unit:"m/s",why:"Her speed at the end. This is what the question asks for."}],
  parts:[{id:"v",label:"Her speed at the end",sym:mi("v"),unit:"m/s",ans:(p,c)=>c.v,
    traps:(p,c)=>[
      [c.gain,`That's the speed she <b>gained</b> (${p.a} × ${p.t}). Now add the ${p.v0} m/s she already had at the start.`],
      [p.v0+p.a,`That's her speed after only 1 second. She speeds up for ${p.t} seconds, so multiply the acceleration by the time.`],
      [(p.v0+p.a)*p.t,`Multiply first, then add: work out ${p.a} × ${p.t} first, then add ${p.v0}.`]
    ]}],
  idea:(p,c)=>{
    const cols=[0,1,2,3].map(n=>({t:n,v:p.v0+p.a*n}));
    return `<p>Every second, she gets <b>${p.a} m/s faster</b>. Look at the pattern:</p>
    <div class="tbl-wrap"><table class="tbl"><tr><th scope="row">Time (s)</th>${cols.map(x=>`<td>${x.t}</td>`).join("")}<td>…</td><td>${p.t}</td></tr>
    <tr><th scope="row">Speed (m/s)</th>${cols.map(x=>`<td>${fmt(x.v)}</td>`).join("")}<td>…</td><td class="q">?</td></tr></table></div>
    <p>In words: <b>speed at the end = starting speed + (speed gained each second) × (number of seconds)</b>.</p>
    <p class="small">Try the question again. The next hint turns this sentence into a formula.</p>`;
  },
  formula:()=>EQ(`${mi("v")}${OP("=")}${V0}${OP("+")}${mi("a")}${mi("t")}`)+
    legend([[mi("v"),"final speed","m/s"],[V0,"starting speed","m/s"],[mi("a"),"acceleration","m/s²"],[mi("t"),"time","s"]],
    `<b>${mi("a")}${mi("t")}</b> means ${mi("a")} × ${mi("t")}. In physics, two letters written next to each other are multiplied.`),
  plug:(p,c)=>EQ(`${mi("v")}${OP("=")}${p.v0}${OP("+")}${p.a}${OP("×")}${p.t}`)+
    `<p>Order of operations: <b>multiply first</b> (${p.a} × ${p.t}), then add ${p.v0}.</p>`+calcTip(`${p.v0}+${p.a}*${p.t}`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${V0} = ${p.v0} m/s, &nbsp;${mi("a")} = ${p.a} m/s², &nbsp;${mi("t")} = ${p.t} s. &nbsp;Find ${mi("v")}.`],
      ["Pick the formula",EQ(`${mi("v")}${OP("=")}${V0}${OP("+")}${mi("a")}${mi("t")}`)],
      ["Put the numbers in",CALC(`${mi("v")} = ${p.v0} + ${p.a} × ${p.t}`)],
      ["Multiply first",CALC(`${p.a} × ${p.t} = <b>${fmt(c.gain)} m/s</b>`)+`<p class="small">This is the speed she gained.</p>`],
      ["Then add the starting speed",CALC(`${mi("v")} = ${p.v0} + ${fmt(c.gain)} = <b>${fmt(c.v)} m/s</b>`)]
    ])+checkline(`Units: ${mi("a")} × ${mi("t")} gives m/s² × s = m/s, which is a speed. ✓`)+finalAns(`${mi("v")} = ${fmt(c.v)} m/s`),
  sheet:[{name:"Speed with constant acceleration",eq:`${mi("v")}${OP("=")}${V0}${OP("+")}${mi("a")}${mi("t")}`,note:`If something "starts from rest", then v₀ = 0.`}],
  takeEq:()=>`${mi("v")}${OP("=")}${V0}${OP("+")}${mi("a")}${mi("t")}`,
  takeaway:"With constant acceleration: speed at the end = starting speed + acceleration × time.",
  link:"HW 2, task 2 is the harder version of this. There the (angular) acceleration changes with time, so you integrate instead of multiplying. When the acceleration is constant, that integral gives exactly this formula.",
  visual:"speed"
},
{
  id:"q2", set:1, topic:"Work & energy", hw:"Like HW 1 & HW 2",
  base:{m:1000,vi:5,vf:15},
  random:()=>{const pr=pick([[5,15],[10,30],[4,12],[10,25],[6,18],[8,20]]);return {m:pick([800,1000,1200,1500]),vi:pr[0],vf:pr[1]};},
  calc:p=>{const Ki=0.5*p.m*p.vi*p.vi,Kf=0.5*p.m*p.vf*p.vf;return {Ki,Kf,dK:Kf-Ki};},
  text:(p,G,T)=>`A car with a ${T("mass","mass")} of ${G("m",`${fmt(p.m)} kg`)} speeds up from ${G("vi",`${p.vi} m/s`)} to ${G("vf",`${p.vf} m/s`)}. By how much does its ${T("ke","kinetic energy")} increase?`,
  terms:{
    mass:["Mass","How much matter something has: basically how heavy it is. Measured in kilograms (kg)."],
    ke:["Kinetic energy","The energy something has because it is moving. The heavier and the faster it is, the more kinetic energy it has. Measured in joules (J)."]
  },
  given:p=>[
    {k:"m",sym:mi("m"),name:"mass",unit:"kg",val:p.m,why:"How heavy the car is."},
    {k:"vi",sym:VI,name:"initial speed",unit:"m/s",val:p.vi,why:`The speed at the start. The small i stands for "initial".`},
    {k:"vf",sym:VF,name:"final speed",unit:"m/s",val:p.vf,why:`The speed at the end. The small f stands for "final".`}
  ],
  find:[{sym:DKE,name:"increase in kinetic energy",unit:"J",why:`Δ is the Greek letter "delta". It means "change in", which is final minus initial. Energy is measured in joules (J).`}],
  parts:[{id:"dk",label:"Increase in kinetic energy",sym:DKE,unit:"J",ans:(p,c)=>c.dK,
    traps:(p,c)=>[
      [0.5*p.m*(p.vf-p.vi)*(p.vf-p.vi),`You squared the <b>change</b> in speed. Kinetic energy uses the speed squared, so work out the energy at each speed first, then subtract.`],
      [c.Kf,`That's the car's kinetic energy at the end. Subtract the energy it already had at the start.`],
      [c.Ki,`That's the kinetic energy at the start. You need the energy at the end minus the energy at the start.`],
      [p.m*(p.vf*p.vf-p.vi*p.vi),`Almost! You forgot the ½ in ½ m v².`],
      [c.dK/1000,`Right number, but in kilojoules. The box wants joules, so multiply by 1000.`]
    ]}],
  idea:(p,c)=>{
    const r=p.vf/p.vi;
    return `<p><b>Kinetic energy</b> is the energy of motion. To find how much it increased:</p>
    <ol class="plain"><li>Work out the car's kinetic energy at the start (speed ${p.vi} m/s).</li><li>Work out its kinetic energy at the end (speed ${p.vf} m/s).</li><li>Increase = energy at the end − energy at the start.</li></ol>
    <div class="watch"><b>Watch out:</b> kinetic energy depends on the speed <b>squared</b> (speed × speed). Here the speed goes up ${fmt(r)} times, so the energy goes up ${fmt(r*r)} times. That's why you can't just use the change in speed.</div>
    <p class="small">Try the question again. The next hint gives you the formula for kinetic energy.</p>`;
  },
  formula:()=>EQ(`${KE}${OP("=")}${HALF}${mi("m")}${sq2(mi("v"))}`)+EQ(`${DKE}${OP("=")}${KEF}${OP("−")}${KEI}`)+
    legend([[KE,"kinetic energy","J"],[mi("m"),"mass","kg"],[mi("v"),"speed","m/s"],[up("Δ"),"“change in” = final − initial",""]],
    `${HALF} ${mi("m")}${sq2(mi("v"))} means ½ × ${mi("m")} × ${mi("v")} × ${mi("v")}. Only the speed is squared, not the mass.`),
  plug:(p,c)=>EQ(`${KEI}${OP("=")}${HALF}${OP("×")}${fmt(p.m)}${OP("×")}${sq2(p.vi)}`)+EQ(`${KEF}${OP("=")}${HALF}${OP("×")}${fmt(p.m)}${OP("×")}${sq2(p.vf)}`)+EQ(`${DKE}${OP("=")}${KEF}${OP("−")}${KEI}`)+
    `<p>Square the speed first (${p.vi}² = ${p.vi} × ${p.vi}), then multiply by ½ and by the mass. Do the same for ${p.vf} m/s, then subtract.</p>`+
    calcTip(`0.5*${p.m}*${p.vf}^2 - 0.5*${p.m}*${p.vi}^2`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${mi("m")} = ${fmt(p.m)} kg, &nbsp;${VI} = ${p.vi} m/s, &nbsp;${VF} = ${p.vf} m/s. &nbsp;Find ${DKE}.`],
      ["Kinetic energy at the start",CALC(`${KEI} = ½ × ${fmt(p.m)} × ${sq2(p.vi)} = ½ × ${fmt(p.m)} × ${p.vi*p.vi} = <b>${fmt(c.Ki)} J</b>`)],
      ["Kinetic energy at the end",CALC(`${KEF} = ½ × ${fmt(p.m)} × ${sq2(p.vf)} = ½ × ${fmt(p.m)} × ${p.vf*p.vf} = <b>${fmt(c.Kf)} J</b>`)],
      ["Subtract: end minus start",CALC(`${DKE} = ${fmt(c.Kf)} − ${fmt(c.Ki)} = <b>${fmt(c.dK)} J</b>`)+`<p class="small">That's ${fmt(c.dK/1000)} kJ (kilojoules).</p>`]
    ])+checkline(`Units: kg × (m/s)² = kg·m²/s², and that is exactly a joule (J). ✓`)+
    watch(`½ × ${fmt(p.m)} × (${p.vf} − ${p.vi})² = ${fmt(0.5*p.m*(p.vf-p.vi)*(p.vf-p.vi))} J is wrong, because ${p.vf}² − ${p.vi}² is not the same as (${p.vf} − ${p.vi})².`)+
    finalAns(`${DKE} = ${fmt(c.dK)} J`),
  sheet:[
    {name:"Kinetic energy",eq:`${KE}${OP("=")}${HALF}${mi("m")}${sq2(mi("v"))}`,note:"Energy of motion, in joules (J)."},
    {name:"Change in kinetic energy",eq:`${DKE}${OP("=")}${HALF}${mi("m")}${ssp(mi("v"),"f","2")}${OP("−")}${HALF}${mi("m")}${ssp(mi("v"),"i","2")}`,note:"Speeds must be in m/s. To convert km/h to m/s, divide by 3.6."}
  ],
  takeEq:()=>`${DKE}${OP("=")}${HALF}${mi("m")}${ssp(mi("v"),"f","2")}${OP("−")}${HALF}${mi("m")}${ssp(mi("v"),"i","2")}`,
  takeaway:"Find the kinetic energy at each speed, then subtract. Never square the change in speed.",
  link:"HW 1, task 2(a) (the truck) and HW 2, task 1 use exactly this. In the truck problem the speeds are in km/h, so divide them by 3.6 to get m/s before you square them.",
  visual:"ke"
},
{
  id:"q3", set:1, topic:"Oscillations", hw:"Like HW 3",
  base:{m:0.5,k:200},
  random:()=>{const pr=pick([[0.5,200],[1,16],[2,50],[0.8,80],[0.2,20],[0.4,10],[4,100]]);return {m:pr[0],k:pr[1]};},
  calc:p=>{const r=p.m/p.k,s=Math.sqrt(r),T=2*Math.PI*s;return {r,s,T,f:1/T,w:Math.sqrt(p.k/p.m)};},
  text:(p,G,T)=>`A ${G("m",`${p.m} kg`)} block is attached to a spring with a ${T("k","spring constant")} of ${G("k",`${p.k} N/m`)}. The block bounces back and forth in ${T("shm","simple harmonic motion")}. Find (a) the ${T("per","period")} and (b) the ${T("freq","frequency")} of the motion.`,
  terms:{
    k:["Spring constant","How stiff the spring is. The unit N/m means newtons of force for every metre of stretch. A bigger number means a stiffer spring."],
    shm:["Simple harmonic motion","A smooth back-and-forth motion that repeats the same way every time, like a block bouncing on a spring or a swinging pendulum."],
    per:["Period","The time for one complete back-and-forth (there and back again). Measured in seconds (s)."],
    freq:["Frequency","How many complete back-and-forths happen in one second. Measured in hertz (Hz). 1 Hz means once per second."]
  },
  given:p=>[
    {k:"m",sym:mi("m"),name:"mass",unit:"kg",val:p.m,why:"The mass of the block. A heavier block moves more slowly."},
    {k:"k",sym:mi("k"),name:"spring constant",unit:"N/m",val:p.k,why:"How stiff the spring is. A stiffer spring pulls harder."}
  ],
  find:[
    {sym:mi("T"),name:"period",unit:"s",why:"The time for one full back-and-forth. Part (a)."},
    {sym:mi("f"),name:"frequency",unit:"Hz",why:"How many full back-and-forths happen each second. Part (b)."}
  ],
  parts:[
    {id:"T",label:"(a) Period",sym:mi("T"),unit:"s",ans:(p,c)=>c.T,
      traps:(p,c)=>[
        [c.s,`That's √(m ÷ k). You still need to multiply it by 2π.`],
        [2*Math.PI*Math.sqrt(p.k/p.m),`You have m and k swapped. The mass goes on top: √(m ÷ k). A heavier block should give a longer period.`],
        [2*Math.PI*c.r,`You forgot the square root. Take √ of (m ÷ k) before multiplying by 2π.`],
        [c.w,`That's ω (omega), the angular frequency in rad/s. The period is T = 2π ÷ ω.`],
        [c.f,`That's the frequency. Part (a) asks for the period T.`],
        [Math.PI*c.s,`Use 2π, not just π.`]
      ]},
    {id:"f",label:"(b) Frequency",sym:mi("f"),unit:"Hz",ans:(p,c)=>c.f,
      traps:(p,c)=>[
        [c.T,`That's the period. The frequency is 1 divided by the period: f = 1 ÷ T.`],
        [c.w,`That's ω in rad/s. The frequency is f = 1 ÷ T (or ω ÷ 2π).`]
      ]}
  ],
  idea:(p,c)=>`<p>Think about what makes the block bounce faster or slower:</p>
    <ul class="plain"><li><b>Heavier block</b> → harder to get moving → slower → <b>longer</b> period.</li><li><b>Stiffer spring</b> (bigger ${mi("k")}) → pulls harder → faster → <b>shorter</b> period.</li></ul>
    <p>So the period depends on <b>mass divided by stiffness</b>, with ${mi("m")} on top and ${mi("k")} on the bottom. The formula also has a square root and a 2π in it (you'll see it in the next hint).</p>
    <p>For the frequency: if one bounce takes ${mi("T")} seconds, the number of bounces in one second is 1 ÷ ${mi("T")}.</p>
    <p class="small">Try the question again, or open the next hint for the formulas.</p>`,
  formula:()=>EQ(`${mi("T")}${OP("=")}2${PI}${SQ(FR(mi("m"),mi("k")),true)}`)+EQ(`${mi("f")}${OP("=")}${FR("1",mi("T"))}`)+
    legend([[mi("T"),"period: time for one full back-and-forth","s"],[mi("f"),"frequency: back-and-forths per second","Hz"],[mi("m"),"mass","kg"],[mi("k"),"spring constant","N/m"],[PI,"pi ≈ 3.1416",""]],
    `√ means square root: √0.25 = 0.5, because 0.5 × 0.5 = 0.25. In HW 3 you will also see ${OMEGA} = √(${mi("k")}/${mi("m")}) and ${mi("T")} = 2π/${OMEGA}. That's the same formula written in two steps.`),
  plug:(p,c)=>EQ(`${mi("T")}${OP("=")}2${PI}${SQ(FR(p.m,p.k),true)}`)+EQ(`${mi("f")}${OP("=")}${FR("1",mi("T"))}`)+
    `<p>Work from the inside out:</p><ol class="plain"><li>Divide ${p.m} ÷ ${p.k}.</li><li>Take the square root of that.</li><li>Multiply by 2π (π ≈ 3.1416).</li></ol><p>Then for ${mi("f")}, divide 1 by your ${mi("T")}.</p>`+
    calcTip(`2*pi*sqrt(${p.m}/${p.k})`,` For the frequency: <code>1/(2*pi*sqrt(${p.m}/${p.k}))</code>.`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${mi("m")} = ${p.m} kg, &nbsp;${mi("k")} = ${p.k} N/m. &nbsp;Find ${mi("T")} and ${mi("f")}.`],
      ["Pick the formula",EQ(`${mi("T")}${OP("=")}2${PI}${SQ(FR(mi("m"),mi("k")),true)}`)],
      ["Inside the square root first",CALC(`${mi("m")} ÷ ${mi("k")} = ${p.m} ÷ ${p.k} = ${fmt(c.r)}`)],
      ["Take the square root",CALC(`√${fmt(c.r)} = ${fmt(c.s)}`)+`<p class="small">Check: ${fmt(c.s)} × ${fmt(c.s)} = ${fmt(c.r)} ✓</p>`],
      ["Multiply by 2π",CALC(`${mi("T")} = 2 × 3.1416 × ${fmt(c.s)} = <b>${fmt(c.T)} s</b>`)],
      ["Frequency is 1 divided by the period",CALC(`${mi("f")} = 1 ÷ ${fmt(c.T)} = <b>${fmt(c.f)} Hz</b>`)]
    ])+checkline(`Another way, the way HW 3 does it: ${OMEGA} = √(${mi("k")} ÷ ${mi("m")}) = √(${p.k} ÷ ${p.m}) = √${fmt(p.k/p.m)} = ${fmt(c.w)} rad/s, and then ${mi("T")} = 2π ÷ ${OMEGA} = 2π ÷ ${fmt(c.w)} = ${fmt(c.T)} s ✓`)+
    finalAns(`${mi("T")} = ${fmt(c.T)} s, &nbsp; ${mi("f")} = ${fmt(c.f)} Hz`)+
    `<p>Meaning: the block makes about ${fmt(c.f)} full back-and-forths every second.</p>`,
  sheet:[
    {name:"Period of a block on a spring",eq:`${mi("T")}${OP("=")}2${PI}${SQ(FR(mi("m"),mi("k")),true)}`,note:"Heavier block: slower. Stiffer spring: faster."},
    {name:"Frequency",eq:`${mi("f")}${OP("=")}${FR("1",mi("T"))}`,note:"In hertz (Hz), meaning per second."},
    {name:"Angular frequency",eq:`${OMEGA}${OP("=")}${SQ(FR(mi("k"),mi("m")),true)}${OP("=")}${FR("2"+PI,mi("T"))}`,note:"In rad/s. Used in HW 3."}
  ],
  takeEq:()=>`${mi("T")}${OP("=")}2${PI}${SQ(FR(mi("m"),mi("k")),true)}<span class="op" style="margin:0 .8em">,</span>${mi("f")}${OP("=")}${FR("1",mi("T"))}`,
  takeaway:"Mass on top, spring constant on the bottom, square root, times 2π. Frequency is one over the period.",
  link:"HW 3, task 1: going from one point of zero speed to the next is only half a back-and-forth, so it is half a period. HW 3, task 2 runs this backwards: find ω first, then the mass from m = k ÷ ω².",
  spring:(p,c)=>({T:c.T,label:`${p.m} kg`,note:`Here is your block on its spring. One full back-and-forth takes ${fmt(c.T)} s, so it makes about ${fmt(c.f)} of them every second.`}),
  visual:"spring"
},

/* ===== Set 2: harder ===== */
{
  id:"q4", set:2, topic:"Kinematics", hw:"Classic exam task · km/h like HW 1",
  base:{kmh:72,dec:4},
  random:()=>{const r=pick([[72,4],[54,2.5],[36,2],[90,5],[72,2.5],[54,3],[36,2.5],[108,5]]);return {kmh:r[0],dec:r[1]};},
  calc:p=>{const v0=p.kmh*10/36,a=-p.dec,t=v0/p.dec;return {v0,a,t,x:v0*t+0.5*a*t*t};},
  text:(p,G,T)=>`A car is driving at ${G("v0",T("kmh",`${p.kmh} km/h`))} when the driver brakes. The car slows down with a constant ${T("dec","deceleration")} of ${G("a",`${p.dec} m/s²`)} until it ${G("v","comes to a stop")}. (a) How long does it take to stop? (b) How far does the car travel while braking?`,
  terms:{
    kmh:["km/h","Kilometres per hour. Physics formulas need metres per second (m/s). To convert, divide by 3.6, because 1 km/h = 1000 m ÷ 3600 s."],
    dec:["Deceleration","Slowing down. A deceleration of 4 m/s² means the speed drops by 4 m/s every second. In formulas you write it as a negative acceleration: a = −4 m/s²."]
  },
  given:p=>{const v0=p.kmh*10/36;return [
    {k:"v0",sym:V0,name:"starting speed",unit:"m/s",val:v0,why:`The speed when braking starts. The question gives ${p.kmh} km/h, but the formulas need m/s. Divide by 3.6 and type the result.`,look:`Start from the ${p.kmh} km/h in the question and divide by 3.6.`,
      gtraps:[[p.kmh,`${p.kmh} is in km/h. The formulas need m/s, so divide by 3.6.`],[p.kmh*3.6,"Divide by 3.6, don't multiply. The number in m/s is smaller than the number in km/h."]]},
    {k:"v",sym:mi("v"),name:"final speed",unit:"m/s",val:0,why:`"Comes to a stop" means the speed at the end is 0. Exam questions often hide a number in words like this.`,look:`Read the end of the question. What speed does "comes to a stop" mean?`},
    {k:"a",sym:mi("a"),name:"acceleration",unit:"m/s²",val:-p.dec,why:"Braking means the speed goes down, so the acceleration is negative. Include the minus sign.",
      gtraps:[[p.dec,"The car is slowing down, so the acceleration is negative. Put a minus sign in front."]]}
  ];},
  find:[

  idea:(p,c)=>`<p>This is the same kind of motion as the easier cyclist question (constant acceleration), except the car is slowing down. Notice two things first:</p>
    <ul class="plain"><li>The speed is in km/h. Physics formulas need m/s, so convert first.</li><li>"Comes to a stop" tells you the final speed: 0.</li></ul>
    <p><b>(a)</b> The car loses ${p.dec} m/s of speed every second. How many seconds does it take to lose <i>all</i> of its starting speed?</p>
    <p><b>(b)</b> The speed drops steadily from the starting speed down to 0. So on average, the car moves at <b>half</b> its starting speed. Distance = average speed × time.</p>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${mi("v")}${OP("=")}${V0}${OP("+")}${mi("a")}${mi("t")}${IMPLIES}${mi("t")}${OP("=")}${FR(`${mi("v")}${OP("−")}${V0}`,mi("a"))}`)+

    `To get ${mi("t")} on its own from ${mi("v")} = ${V0} + ${mi("a")}${mi("t")}: subtract ${V0} from both sides, then divide both sides by ${mi("a")}. To convert km/h to m/s, divide by 3.6. Shortcut for anything that stops: distance = average speed × time = ½ × ${V0} × ${mi("t")}.`),
  plug:(p,c)=>CALC(`${V0} = ${p.kmh} ÷ 3.6 = ${fmt(c.v0)} m/s`)+
    EQ(`${mi("t")}${OP("=")}${FR(`0${OP("−")}${fmt(c.v0)}`,`−${p.dec}`)}`)+

    `<p>Work out ${mi("t")} first, then use it in the distance formula. A minus divided by a minus gives a plus, and ½ × (−${p.dec}) is negative.</p>`+

{
  id:"q5", set:2, topic:"Work & energy", hw:"Like HW 2, task 1",
  base:{m:20,F:60,d:5,vi:1,vf:3},
  random:()=>{const r=pick([[20,60,5,1,3],[25,50,6,1,3],[10,40,5,2,4],[20,80,4,1,4],[30,90,5,2,3],[15,45,8,1,3]]);return {m:r[0],F:r[1],d:r[2],vi:r[3],vf:r[4]};},
  calc:p=>{const W=p.F*p.d,Ki=0.5*p.m*p.vi*p.vi,Kf=0.5*p.m*p.vf*p.vf,dK=Kf-Ki,Q=W-dK;return {W,Ki,Kf,dK,Q,Ff:Q/p.d};},
  text:(p,G,T)=>`A worker pushes a ${G("m",`${p.m} kg`)} box across a rough floor with a constant horizontal ${T("force","force")} of ${G("F",`${p.F} N`)}. While the box moves ${G("d",`${p.d} m`)}, its speed increases from ${G("vi",`${p.vi} m/s`)} to ${G("vf",`${p.vf} m/s`)}. (a) How much ${T("work","work")} does the worker do? (b) How much energy does ${T("fric","friction")} turn into heat? (c) How big is the friction force?`,
  terms:{
    force:["Force","A push or a pull. Measured in newtons (N)."],
    work:["Work","The energy you transfer by pushing something over a distance. Work = force × distance. Measured in joules (J)."],
    fric:["Friction","A force between two surfaces that rub against each other. It always acts against the motion, and it turns kinetic energy into heat."]
  },
  given:p=>[
    {k:"m",sym:mi("m"),name:"mass",unit:"kg",val:p.m,why:"How heavy the box is."},
    {k:"F",sym:mi("F"),name:"pushing force",unit:"N",val:p.F,why:"How hard the worker pushes."},
    {k:"d",sym:mi("d"),name:"distance",unit:"m",val:p.d,why:"How far the box moves while being pushed."},
    {k:"vi",sym:VI,name:"initial speed",unit:"m/s",val:p.vi,why:"The speed at the start (i for initial).",look:"It's the first speed in the question."},
    {k:"vf",sym:VF,name:"final speed",unit:"m/s",val:p.vf,why:"The speed at the end (f for final).",look:"It's the second speed in the question."}
  ],
  find:[
    {sym:mi("W"),name:"work done by the worker",unit:"J",why:"Part (a)."},
    {sym:mi("Q"),name:"heat from friction",unit:"J",why:"Part (b). Physicists often use Q for heat."},
    {sym:FFR,name:"friction force",unit:"N",why:"Part (c). The small fr stands for friction."}
  ],
  parts:[
    {id:"W",label:"(a) Work done by the worker",sym:mi("W"),unit:"J",ans:(p,c)=>c.W,
      traps:(p,c)=>[
        [p.F/p.d,"Work is force × distance, so multiply."],
        [p.m*9.8*p.d,"That uses the box's weight (m × g). The worker's work uses the worker's push F."],
        [c.dK,"That's the kinetic energy the box gained. The work done by the worker is force × distance."]
      ]},
    {id:"Q",label:"(b) Heat from friction",sym:mi("Q"),unit:"J",ans:(p,c)=>c.Q,
      traps:(p,c)=>[
        [c.dK,"That's the kinetic energy the box gained. The heat is the rest of the work: Q = W − ΔKE."],
        [c.W,"That's all of the work. Part of it went into speeding up the box, so subtract the kinetic energy gained."],
        [c.W-c.Kf,`You forgot that the box already had kinetic energy at the start (it was moving at ${p.vi} m/s). Use ΔKE = ½mv<sub>f</sub>² − ½mv<sub>i</sub>².`],
        [c.W-0.5*p.m*(p.vf-p.vi)*(p.vf-p.vi),"You squared the change in speed, a classic trap. Use ½mv<sub>f</sub>² − ½mv<sub>i</sub>²."],
        [c.W+c.dK,"Add or subtract? The work splits into kinetic energy and heat, so heat = W − ΔKE."]
      ]},
    {id:"Ff",label:"(c) Friction force",sym:FFR,unit:"N",ans:(p,c)=>c.Ff,
      traps:(p,c)=>[
        [c.Q*p.d,"Divide by the distance, don't multiply: F<sub>fr</sub> = Q ÷ d."],
        [p.F,"That's the worker's push. The friction force comes from the heat: F<sub>fr</sub> = Q ÷ d."],
        [c.dK/p.d,"Use the heat Q, not the kinetic energy: F<sub>fr</sub> = Q ÷ d."]
      ]}
  ],
  idea:(p,c)=>`<p>Think of energy like money. The worker <b>pays in</b> energy by pushing: that's the work. The energy goes to two places:</p>
    <ol class="plain"><li>Making the box faster: the kinetic energy gained.</li><li>Heat, because friction rubs the box against the floor.</li></ol>
    <p>So <b>work = kinetic energy gained + heat</b>. Once you know the work and the kinetic energy gained, the heat is whatever is left over.</p>
    <p>For (c): friction made that heat over the ${p.d} m. Just like work, heat from friction = friction force × distance.</p>
    <div class="watch"><b>Remember the easier car question:</b> the box was already moving at the start, so the kinetic energy gained is the energy at the end minus the energy at the start.</div>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${mi("W")}${OP("=")}${mi("F")}${mi("d")}`)+
    EQ(`${DKE}${OP("=")}${HALF}${mi("m")}${ssp(mi("v"),"f","2")}${OP("−")}${HALF}${mi("m")}${ssp(mi("v"),"i","2")}`)+
    EQ(`${mi("W")}${OP("=")}${DKE}${OP("+")}${mi("Q")}${IMPLIES}${mi("Q")}${OP("=")}${mi("W")}${OP("−")}${DKE}`)+
    EQ(`${mi("Q")}${OP("=")}${FFR}${mi("d")}${IMPLIES}${FFR}${OP("=")}${FR(mi("Q"),mi("d"))}`)+
    legend([[mi("W"),"work done by the worker","J"],[mi("F"),"pushing force","N"],[mi("d"),"distance","m"],[DKE,"kinetic energy gained","J"],[mi("Q"),"heat from friction","J"],[FFR,"friction force","N"]],
    `${mi("W")} = ${DKE} + ${mi("Q")} is energy conservation: every joule the worker puts in ends up either as speed or as heat.`),
  plug:(p,c)=>EQ(`${mi("W")}${OP("=")}${p.F}${OP("×")}${p.d}`)+
    EQ(`${DKE}${OP("=")}${HALF}${OP("×")}${p.m}${OP("×")}${sq2(p.vf)}${OP("−")}${HALF}${OP("×")}${p.m}${OP("×")}${sq2(p.vi)}`)+
    EQ(`${mi("Q")}${OP("=")}${mi("W")}${OP("−")}${DKE}`)+
    EQ(`${FFR}${OP("=")}${FR(mi("Q"),p.d)}`)+
    `<p>Do them in order. Each answer feeds into the next one.</p>`+
    calcTip(`${p.F}*${p.d} - (0.5*${p.m}*${p.vf}^2 - 0.5*${p.m}*${p.vi}^2)`," That one line gives you the heat Q."),
  solution:(p,c)=>{const acc=(p.vf*p.vf-p.vi*p.vi)/(2*p.d);return steps([
      ["Write down what you know",`${mi("m")} = ${p.m} kg, &nbsp;${mi("F")} = ${p.F} N, &nbsp;${mi("d")} = ${p.d} m, &nbsp;${VI} = ${p.vi} m/s, &nbsp;${VF} = ${p.vf} m/s.`],
      ["(a) Work = force × distance",CALC(`${mi("W")} = ${p.F} × ${p.d} = <b>${fmt(c.W)} J</b>`)],
      ["Kinetic energy gained",CALC(`${DKE} = ½ × ${p.m} × ${sq2(p.vf)} − ½ × ${p.m} × ${sq2(p.vi)} = ${fmt(c.Kf)} − ${fmt(c.Ki)} = ${fmt(c.dK)} J`)],
      ["(b) Heat is what's left",CALC(`${mi("Q")} = ${mi("W")} − ${DKE} = ${fmt(c.W)} − ${fmt(c.dK)} = <b>${fmt(c.Q)} J</b>`)],
      ["(c) Friction force",CALC(`${FFR} = ${mi("Q")} ÷ ${mi("d")} = ${fmt(c.Q)} ÷ ${p.d} = <b>${fmt(c.Ff)} N</b>`)]
    ])+checkline(`Units: N × m = J, and J ÷ m = N ✓<br>Sense check: friction (${fmt(c.Ff)} N) is smaller than the push (${p.F} N). That fits, because the box speeds up.<br>Another way, with Newton's second law: the box's acceleration is (${sq2(p.vf)} − ${sq2(p.vi)}) ÷ (2 × ${p.d}) = ${fmt(acc)} m/s², so the net force is ${p.m} × ${fmt(acc)} = ${fmt(p.m*acc)} N, and friction = ${p.F} − ${fmt(p.m*acc)} = ${fmt(c.Ff)} N ✓`)+
    finalAns(`${mi("W")} = ${fmt(c.W)} J, &nbsp;${mi("Q")} = ${fmt(c.Q)} J, &nbsp;${FFR} = ${fmt(c.Ff)} N`);},
  sheet:[
    {name:"Work",eq:`${mi("W")}${OP("=")}${mi("F")}${mi("d")}`,note:"Force × distance, in joules (J)."},
    {name:"Energy bookkeeping",eq:`${mi("W")}${OP("=")}${DKE}${OP("+")}${mi("Q")}`,note:"Energy in = kinetic energy gained + heat."},
    {name:"Heat from friction",eq:`${mi("Q")}${OP("=")}${FFR}${mi("d")}`,note:"Friction force × distance."}
  ],
  takeEq:()=>`${mi("W")}${OP("=")}${DKE}${OP("+")}${mi("Q")}`,
  takeaway:"Energy in = kinetic energy gained + heat. The heat from friction is the friction force times the distance.",
  link:"HW 2, task 1 is this exact bookkeeping. There the box slows down, so ΔKE is negative and the heat Q = W − ΔKE comes out bigger than the work. Same formula, just keep the minus sign.",
  visual:"split"
},
{
  id:"q6", set:2, topic:"Oscillations", hw:"Like HW 3, task 2",
  base:{k:200,x:0.03,v:0.8,a:-12},
  random:()=>{const r=pick([[200,0.03,0.8,-12],[450,0.04,0.9,-36],[160,0.06,0.8,-6],[100,0.05,1.2,-5],[250,0.3,2,-7.5],[320,0.12,0.4,-7.68]]);return {k:r[0],x:r[1],v:r[2],a:r[3]};},
  calc:p=>{const w=Math.sqrt(-p.a/p.x),u=p.v/w;return {w,f:w/(2*Math.PI),T:2*Math.PI/w,m:p.k/(w*w),u,A:Math.sqrt(p.x*p.x+u*u)};},
  text:(p,G,T)=>`A block on a spring with a ${T("k","spring constant")} of ${G("k",`${p.k} N/m`)} moves in ${T("shm","simple harmonic motion")}. At one moment the block is ${G("x",`${p.x} m`)} from its ${T("eq","equilibrium position")}, moving at ${G("v",`${p.v} m/s`)}, and its acceleration is ${G("a",`${neg(p.a)} m/s²`)}. Find (a) the ${T("freq","frequency")} of the oscillation, (b) the mass of the block and (c) the ${T("amp","amplitude")}.`,
  terms:{
    k:["Spring constant","How stiff the spring is. The unit N/m means newtons of force for every metre of stretch. A bigger number means a stiffer spring."],
    shm:["Simple harmonic motion","A smooth back-and-forth motion that repeats the same way every time, like a block bouncing on a spring or a swinging pendulum."],
    eq:["Equilibrium position","The resting point in the middle, where the spring is neither stretched nor squashed. Positions (x) are measured from here."],
    freq:["Frequency","How many complete back-and-forths happen in one second. Measured in hertz (Hz). 1 Hz means once per second."],

  given:p=>[
    {k:"k",sym:mi("k"),name:"spring constant",unit:"N/m",val:p.k,why:"How stiff the spring is."},
    {k:"x",sym:mi("x"),name:"position",unit:"m",val:p.x,why:"How far the block is from the middle right now."},

    {sym:mi("f"),name:"frequency",unit:"Hz",why:"Part (a)."},

  parts:[
    {id:"f",label:"(a) Frequency",sym:mi("f"),unit:"Hz",ans:(p,c)=>c.f,
      traps:(p,c)=>[
        [c.w,"That's ω (omega), the angular frequency in rad/s. The frequency is f = ω ÷ 2π."],

        [p.x,"That's where the block is right now. The amplitude is the farthest it ever gets, which is further out."],

  idea:(p,c)=>`<p>Three facts about simple harmonic motion do all the work here:</p>
    <ol class="plain">
      <li><b>The acceleration always points back to the middle</b>, and it gets bigger the further out the block is. The number linking acceleration and position is ω² (omega squared). That's why the acceleration is negative here while the position is positive.</li>
      <li><b>ω also links the spring and the mass.</b> A stiffer spring or a lighter block gives a bigger ω. Once you know ω and ${mi("k")}, you can find ${mi("m")}.</li>
      <li><b>Energy is conserved.</b> Right now the energy is split between the stretched spring and the motion. At the amplitude the block stops for an instant, so all the energy is in the spring. Set the two equal and solve for ${mi("A")}.</li>
    </ol>
    <p>The frequency works the same as for any oscillation: divide ω by 2π.</p>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${mi("a")}${OP("=")}−${sq2(OMEGA)}${mi("x")}${IMPLIES}${OMEGA}${OP("=")}${SQ(FR(`−${mi("a")}`,mi("x")),true)}`)+
    EQ(`${mi("f")}${OP("=")}${FR(OMEGA,"2"+PI)}`)+
    EQ(`${OMEGA}${OP("=")}${SQ(FR(mi("k"),mi("m")),true)}${IMPLIES}${mi("m")}${OP("=")}${FR(mi("k"),sq2(OMEGA))}`)+
    EQ(`${HALF}${mi("k")}${sq2(mi("A"))}${OP("=")}${HALF}${mi("k")}${sq2(mi("x"))}${OP("+")}${HALF}${mi("m")}${sq2(mi("v"))}`)+
    EQ(`${mi("A")}${OP("=")}${SQ(`${sq2(mi("x"))}${OP("+")}<span class="paren">(</span>${FR(mi("v"),OMEGA)}<span class="paren">)</span><sup>2</sup>`,true)}`)+
    legend([[OMEGA,"angular frequency","rad/s"],[mi("f"),"frequency","Hz"],[mi("a"),"acceleration","m/s²"],[mi("x"),"position (distance from the middle)","m"],[mi("v"),"speed","m/s"],[mi("k"),"spring constant","N/m"],[mi("m"),"mass","kg"],[mi("A"),"amplitude","m"]],
    `Because ${mi("a")} is negative, −${mi("a")} is positive, so the square root works. The energy line says: spring energy at the turning point = spring energy now + motion energy now. Divide it by ½${mi("k")} and use ${mi("k")}/${mi("m")} = ${sq2(OMEGA)} to get the ${mi("A")} formula.`),
  plug:(p,c)=>EQ(`${OMEGA}${OP("=")}${SQ(FR(neg(-p.a),p.x),true)}`)+
    EQ(`${mi("f")}${OP("=")}${FR(OMEGA,"2"+PI)}`)+
    EQ(`${mi("m")}${OP("=")}${FR(p.k,sq2(OMEGA))}`)+
    EQ(`${mi("A")}${OP("=")}${SQ(`${sq2(p.x)}${OP("+")}<span class="paren">(</span>${FR(p.v,OMEGA)}<span class="paren">)</span><sup>2</sup>`,true)}`)+
    `<p>Find ${OMEGA} first and write it down, because all three answers use it. Note that −${mi("a")} = −(${neg(p.a)}) = ${-p.a}, a positive number.</p>`+
    calcTip(`sqrt(${-p.a}/${p.x})`," Then put your ω into the other formulas."),

  formula:()=>EQ(`${PE}${OP("=")}${mi("m")}${G9}${mi("h")}${AND}${KE}${OP("=")}${HALF}${mi("m")}${sq2(mi("v"))}`)+
    EQ(`${mi("m")}${G9}${H1}${OP("=")}${HALF}${mi("m")}${sq2(VB)}${IMPLIES}${VB}${OP("=")}${SQ(`2${G9}${H1}`)}`)+
    EQ(`${mi("m")}${G9}${H1}${OP("=")}${mi("m")}${G9}${H2}${OP("+")}${HALF}${mi("m")}${sq2(V2)}`)+
    EQ(`${V2}${OP("=")}${SQ(`2${G9}(${H1}${OP("−")}${H2})`)}`)+
    legend([[PE,"potential energy","J"],[KE,"kinetic energy","J"],[mi("m"),"mass","kg"],[G9,"gravity","m/s²"],[mi("h"),"height above the ground","m"],[mi("v"),"speed","m/s"]],
    `Each line says: total energy at the start = total energy now. To get ${VB} from the second line: divide both sides by ${mi("m")} (it cancels), multiply by 2, then take the square root.`),
  plug:(p,c)=>EQ(`${PE}${OP("=")}${p.m}${OP("×")}9.8${OP("×")}${p.h1}`)+
    EQ(`${VB}${OP("=")}${SQ(`2${OP("×")}9.8${OP("×")}${p.h1}`)}`)+
    EQ(`${V2}${OP("=")}${SQ(`2${OP("×")}9.8${OP("×")}(${p.h1}${OP("−")}${p.h2})`)}`)+
    `<p>Work inside the square root first, then take the root.</p>`+calcTip(`sqrt(2*9.8*${p.h1})`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${mi("m")} = ${p.m} kg, &nbsp;${V0} = 0, &nbsp;${H1} = ${p.h1} m, &nbsp;${G9} = 9.8 m/s², &nbsp;${H2} = ${p.h2} m.`],
      ["(a) Potential energy at the top",CALC(`${PE} = ${mi("m")}${G9}${H1} = ${p.m} × 9.8 × ${p.h1} = <b>${fmt(c.PE)} J</b>`)],
      ["(b) All of it becomes kinetic energy",CALC(`½${mi("m")}${sq2(VB)} = ${mi("m")}${G9}${H1} &nbsp;→&nbsp; ${VB} = √(2 × 9.8 × ${p.h1}) = √${fmt(2*c.g*p.h1)} = <b>${fmt(c.v1)} m/s</b>`)+`<p class="small">The mass cancelled, so it doesn't matter how heavy she is.</p>`],
      ["(c) How far has she dropped?",CALC(`${H1} − ${H2} = ${p.h1} − ${p.h2} = ${fmt(c.dh)} m`)],
      ["Same idea with that drop",CALC(`${V2} = √(2 × 9.8 × ${fmt(c.dh)}) = √${fmt(2*c.g*c.dh)} = <b>${fmt(c.v2)} m/s</b>`)]
    ])+checkline(`Energy check: at the bottom her kinetic energy is ½ × ${p.m} × ${sq2(fmt(c.v1))} = ${fmt(0.5*p.m*c.v1*c.v1)} J, the same as her potential energy at the top ✓<br>Sense check: ${fmt(c.v2)} m/s is less than ${fmt(c.v1)} m/s, because she has climbed back up a bit ✓`)+
    finalAns(`${PE} = ${fmt(c.PE)} J, &nbsp;${VB} = ${fmt(c.v1)} m/s, &nbsp;${V2} = ${fmt(c.v2)} m/s`),
  sheet:[
    {name:"Potential energy",eq:`${PE}${OP("=")}${mi("m")}${G9}${mi("h")}`,note:"Energy stored by height."},
    {name:"Energy conservation (no friction)",eq:`${mi("m")}${G9}${H1}${OP("+")}${HALF}${mi("m")}${sq2(sb(mi("v"),"1"))}${OP("=")}${mi("m")}${G9}${H2}${OP("+")}${HALF}${mi("m")}${sq2(sb(mi("v"),"2"))}`,note:"Total energy at one point = total energy at another."},
    {name:"Speed after a drop h",eq:`${mi("v")}${OP("=")}${SQ(`2${G9}${mi("h")}`)}`,note:"Starting from rest. The mass cancels."}
  ],
  takeEq:()=>`${mi("m")}${G9}${mi("h")}${OP("=")}${HALF}${mi("m")}${sq2(mi("v"))}${IMPLIES}${mi("v")}${OP("=")}${SQ(`2${G9}${mi("h")}`)}`,
  takeaway:"With no friction, height energy and motion energy swap but the total stays the same. Speed depends on how far you've dropped, not on your mass.",
  link:"No homework uses this yet, but energy conservation is a core exam topic. HW 3, task 3 uses the same idea for a spring: energy moves between potential and kinetic while the total stays the same.",
  viz:viz.slider((p,c)=>({
    note:"Drag her height. The energy bar never changes length: height energy just turns into motion energy and back.",
    label:"Her height",unit:"m",min:0,max:p.h1,step:0.1,value:p.h2,
    bars:[{label:"Her energy",segs:[{cls:"seg-alt",name:"potential (height)",frac:x=>x/p.h1},{cls:"seg-ke",name:"kinetic (motion)",frac:x=>(p.h1-x)/p.h1}]}],
    read:x=>{const d=Math.max(0,R3(p.h1-x));return `At ${fmt(x)} m: ${PE} = ${fmt(p.m*c.g*x)} J, ${KE} = ${fmt(p.m*c.g*d)} J, speed = <b>${fmt(Math.sqrt(2*c.g*d))} m/s</b>`;}
  }))
},

/* ===== 2. Doppler effect ===== */
{
  id:"q2", topic:"Doppler effect", hw:"Course topic: Doppler effect",
  base:{f:700,vs:25},
  random:()=>({f:pick([500,600,700,800,900]),vs:pick([15,20,25,30,40])}),
  calc:p=>{const v=340;return {v,ft:p.f*v/(v-p.vs),fa:p.f*v/(v+p.vs),lf:(v-p.vs)/p.f,l0:v/p.f};},
  text:(p,G,T)=>`An ambulance siren gives out sound at a ${T("freq","frequency")} of ${G("f",`${p.f} Hz`)}. The ambulance drives at ${G("vs",`${p.vs} m/s`)} while you ${G("vo","stand still")} by the road. The ${T("sos","speed of sound")} in air is ${G("v","340 m/s")}. (a) What frequency do you hear while the ambulance comes towards you? (b) What frequency do you hear after it passes and drives away? (c) What is the ${T("lambda","wavelength")} of the sound in front of the ambulance?`,
  terms:{
    freq:["Frequency","How many wave crests arrive each second, in hertz (Hz). A higher frequency sounds like a higher pitch."],
    sos:["Speed of sound","How fast sound travels through the air. It depends on the air, not on how fast the ambulance moves."],
    lambda:["Wavelength","The distance from one wave crest to the next. Measured in metres."]
  },
  given:p=>[
    {k:"f",sym:mi("f"),name:"siren frequency",unit:"Hz",val:p.f,why:"The frequency the siren actually makes."},
    {k:"vs",sym:VS,name:"speed of the source",unit:"m/s",val:p.vs,why:"The small s means source: the thing making the sound (the ambulance)."},
    {k:"vo",sym:VO,name:"speed of the observer",unit:"m/s",val:0,why:`"Stand still" means your speed is 0. The small o means observer: the one listening.`,look:`You "stand still". What speed is that?`},
    {k:"v",sym:mi("v"),name:"speed of sound",unit:"m/s",val:340,why:"How fast the sound itself travels."}
  ],
  find:[
    {sym:FT,name:"frequency you hear as it comes towards you",unit:"Hz",why:"Part (a)."},
    {sym:FA,name:"frequency you hear as it drives away",unit:"Hz",why:"Part (b)."},
    {sym:LF,name:"wavelength in front of the ambulance",unit:"m",why:"Part (c)."}
  ],
  parts:[
    {id:"ft",label:"(a) Frequency as it comes towards you",sym:FT,unit:"Hz",ans:(p,c)=>c.ft,traps:(p,c)=>[
      [c.fa,"That's the frequency as it drives away. Coming towards you, the waves get squeezed together, so the pitch is higher: divide by (v − vₛ)."],
      [p.f,"That's the siren's own frequency. Because the ambulance moves, you hear a different one."],
      [p.f*(c.v-p.vs)/c.v,"Upside down: the speed of sound goes on top, f × v ÷ (v − vₛ)."],
      [p.f*p.vs/c.v,"Use the speed of sound in the formula: f × v ÷ (v − vₛ)."]
    ]},
    {id:"fa",label:"(b) Frequency as it drives away",sym:FA,unit:"Hz",ans:(p,c)=>c.fa,traps:(p,c)=>[
      [c.ft,"That's the frequency as it comes towards you. Driving away stretches the waves, so the pitch is lower: divide by (v + vₛ)."],
      [p.f,"That's the siren's own frequency. Because the ambulance moves, you hear a different one."],
      [p.f*(c.v+p.vs)/c.v,"Upside down: the speed of sound goes on top, f × v ÷ (v + vₛ)."]
    ]},
    {id:"lf",label:"(c) Wavelength in front of the ambulance",sym:LF,unit:"m",ans:(p,c)=>c.lf,traps:(p,c)=>[
      [c.l0,"That's the wavelength if the ambulance stood still (v ÷ f). In front of it the waves are squeezed closer: λ = (v − vₛ) ÷ f."],
      [(c.v+p.vs)/p.f,"That's the wavelength behind the ambulance. In front, subtract: (v − vₛ) ÷ f."],
      [p.f/(c.v-p.vs),"Upside down: λ = (v − vₛ) ÷ f."],
      [p.vs/p.f,"Use the speed of sound too: λ = (v − vₛ) ÷ f."]
    ]}
  ],
  idea:(p,c)=>`<p>The siren sends out ${p.f} wave crests every second. The sound itself always travels at 340 m/s. What changes is the <b>spacing</b> between the crests.</p>
    <ul class="plain">
      <li><b>(a) Coming towards you:</b> the ambulance chases its own sound, so each new crest starts a bit closer to you. The crests arrive squeezed together, more per second, so you hear a <b>higher</b> pitch.</li>
      <li><b>(b) Driving away:</b> each crest starts a bit further away, so the crests are stretched out and you hear a <b>lower</b> pitch.</li>
      <li><b>(c)</b> Between two crests, the sound moves ahead by v ÷ f, but the ambulance follows it by vₛ ÷ f. The gap that's left in front is the wavelength.</li>
    </ul>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${FT}${OP("=")}${mi("f")}${OP("×")}${FR(mi("v"),`${mi("v")}${OP("−")}${VS}`)}`)+
    EQ(`${FA}${OP("=")}${mi("f")}${OP("×")}${FR(mi("v"),`${mi("v")}${OP("+")}${VS}`)}`)+
    EQ(`${LF}${OP("=")}${FR(`${mi("v")}${OP("−")}${VS}`,mi("f"))}`)+
    legend([[mi("f"),"frequency of the siren","Hz"],[mi("v"),"speed of sound","m/s"],[VS,"speed of the ambulance (source)","m/s"],[FT,"heard as it comes towards you","Hz"],[FA,"heard as it drives away","Hz"],[LF,"wavelength in front","m"]],
    `Memory trick: towards you means a higher pitch, so make the bottom of the fraction smaller (minus). Away means lower, so make the bottom bigger (plus). If you were moving too, the general formula is ${mi("f")}′ = ${mi("f")}(${mi("v")} ± ${VO}) ÷ (${mi("v")} ∓ ${VS}), with the signs picked the same way.`),
  plug:(p,c)=>EQ(`${FT}${OP("=")}${p.f}${OP("×")}${FR("340",`340${OP("−")}${p.vs}`)}`)+
    EQ(`${FA}${OP("=")}${p.f}${OP("×")}${FR("340",`340${OP("+")}${p.vs}`)}`)+
    EQ(`${LF}${OP("=")}${FR(`340${OP("−")}${p.vs}`,p.f)}`)+
    `<p>Do the bracket at the bottom first, then divide.</p>`+calcTip(`${p.f}*340/(340-${p.vs})`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${mi("f")} = ${p.f} Hz, &nbsp;${VS} = ${p.vs} m/s, &nbsp;${VO} = 0, &nbsp;${mi("v")} = 340 m/s.`],
      ["(a) Coming towards you: squeezed waves, higher pitch",CALC(`${FT} = ${p.f} × 340 ÷ (340 − ${p.vs}) = ${p.f} × 340 ÷ ${340-p.vs} = <b>${fmt(c.ft)} Hz</b>`)],
      ["(b) Driving away: stretched waves, lower pitch",CALC(`${FA} = ${p.f} × 340 ÷ (340 + ${p.vs}) = ${p.f} × 340 ÷ ${340+p.vs} = <b>${fmt(c.fa)} Hz</b>`)],
      ["(c) Wavelength in front",CALC(`${LF} = (340 − ${p.vs}) ÷ ${p.f} = ${340-p.vs} ÷ ${p.f} = <b>${fmt(c.lf)} m</b>`)]
    ])+checkline(`Sense check: ${fmt(c.ft)} Hz is higher than ${p.f} Hz, and ${fmt(c.fa)} Hz is lower ✓<br>Check (c) with v = fλ: the sound in front reaches you at 340 m/s with frequency ${fmt(c.ft)} Hz, so λ = 340 ÷ ${fmt(c.ft)} = ${fmt(c.v/c.ft)} m, the same as (c) ✓`)+
    finalAns(`${FT} = ${fmt(c.ft)} Hz, &nbsp;${FA} = ${fmt(c.fa)} Hz, &nbsp;${LF} = ${fmt(c.lf)} m`),
  sheet:[
    {name:"Doppler: source moving, you standing still",eq:`${mi("f")}′${OP("=")}${mi("f")}${OP("×")}${FR(mi("v"),`${mi("v")}${OP("∓")}${VS}`)}`,note:"Minus when it comes towards you (higher pitch), plus when it goes away."},
    {name:"Wavelength in front of a moving source",eq:`${LF}${OP("=")}${FR(`${mi("v")}${OP("−")}${VS}`,mi("f"))}`,note:"Behind it: (v + vₛ) ÷ f."}
  ],
  takeEq:()=>`${mi("f")}′${OP("=")}${mi("f")}${OP("×")}${FR(mi("v"),`${mi("v")}${OP("∓")}${VS}`)}`,
  takeaway:"A moving source squeezes the waves in front (higher pitch) and stretches them behind (lower pitch). The speed of sound itself doesn't change.",
  link:"No homework on this yet, but the Doppler effect is on your course list under mechanical waves. The same idea lets ultrasound scanners measure how fast blood flows, which is also on the list.",
  viz:{
    html:(p,c)=>`<p class="sec-note">Each circle is one wave crest from the siren. Drag the speed and watch the crests bunch up in front and spread out behind. (The drawing is slowed down a lot so you can see it.)</p>
      <div class="viz-box">
        <label class="viz-l" for="dp-s">Ambulance speed: <output id="dp-so">${p.vs}</output> m/s</label>
        <input type="range" id="dp-s" min="0" max="300" step="5" value="${p.vs}">
        <svg class="vsvg" viewBox="0 0 400 160" role="img" aria-label="Wave crests spreading out from a moving siren">
          <g id="dp-waves"></g>
          <circle id="dp-src" class="v-dot" r="5" cx="30" cy="80"/>
          <line class="v-wall" x1="394" y1="70" x2="394" y2="90"/>
          <text class="v-text" x="388" y="64" text-anchor="end">you</text>
        </svg>
        <p class="viz-read" id="dp-read"></p>
      </div>`,
    setup:(p,c,ctx)=>{
      const r=ctx.$("#dp-s"),g=ctx.$("#dp-waves"),src=ctx.$("#dp-src"),out=ctx.$("#dp-so"),read=ctx.$("#dp-read");
      const CV=70,TE=0.45,XA=30,XB=330,Y=80;
      let t=0,lastEmit=-1,waves=[],xs=XA;
      const upd=()=>{const s=+r.value;out.textContent=s;
        read.innerHTML=`At ${s} m/s: in front you hear <b>${fmt(p.f*c.v/(c.v-s))} Hz</b>, behind <b>${fmt(p.f*c.v/(c.v+s))} Hz</b>. The siren itself makes ${p.f} Hz. Wavelength in front: ${fmt((c.v-s)/p.f)} m.`;};
      const step=dt=>{t+=dt;xs+=CV*(+r.value)/c.v*dt;
        if(xs>XB){xs=XA;waves=[];t=0;lastEmit=-1;}
        if(lastEmit<0||t-lastEmit>=TE){waves.push({x:xs,t0:t});lastEmit=t;}
        waves=waves.filter(w=>CV*(t-w.t0)<420);
        g.innerHTML=waves.map(w=>{const rr=CV*(t-w.t0);return `<circle class="v-main" style="stroke-width:1.4;opacity:${Math.max(0.15,1-rr/420).toFixed(2)}" cx="${w.x.toFixed(1)}" cy="${Y}" r="${rr.toFixed(1)}"/>`;}).join("");
        src.setAttribute("cx",xs.toFixed(1));};
      r.addEventListener("input",upd);upd();
      if(ctx.reduceMotion){for(let i=0;i<80;i++)step(0.05);}else ctx.loop(step);
    }
  }
},

/* ===== 3. Changing acceleration (integration) ===== */
{
  id:"q3", topic:"Changing acceleration", hw:"Like HW 2, task 2",
  base:{A:6,B:2,v0:1,x0:0,T:3},
  random:()=>{const r=pick([[6,2,1,0,3],[6,4,3,2,2],[12,2,0,1,2],[6,8,5,0,3],[12,4,2,0,3],[6,2,4,1,2]]);return {A:r[0],B:r[1],v0:r[2],x0:r[3],T:r[4]};},
  calc:p=>{const T=p.T;return {a:p.A*T-p.B,v:R3(p.v0+p.A/2*T*T-p.B*T),x:R3(p.x0+p.v0*T+p.A/6*T*T*T-p.B/2*T*T)};},
  text:(p,G,T)=>`A small robot moves along a straight track. Its ${T("acc","acceleration")} ${T("chg","changes with time")}: ${mi("a")}(${mi("t")}) = ${poly(aT(p))}, with ${mi("a")} in m/s² and ${mi("t")} in seconds. At ${mi("t")} = 0 it ${p.v0===0?`starts ${G("v0","from rest")}`:`has a velocity of ${G("v0",`${p.v0} m/s`)}`} at position ${G("x0",`${p.x0} m`)}. Find (a) its acceleration, (b) its velocity and (c) its position ${G("T",`${p.T} s`)} after the start.`,
  terms:{
    acc:["Acceleration","How fast the velocity changes. Here it isn't constant: the formula gives a different value at each moment."],
    chg:["Changes with time","Because the acceleration keeps changing, simple formulas like v = v₀ + at don't work. You have to add up the changes bit by bit, which is what integrating means. Hint 2 explains it in plain words."]
  },
  given:p=>[
    {k:"v0",sym:V0,name:"starting velocity",unit:"m/s",val:p.v0,why:"The velocity at t = 0.",look:p.v0===0?`"From rest" means not moving. What velocity is that?`:undefined},
    {k:"x0",sym:X0,name:"starting position",unit:"m",val:p.x0,why:"Where the robot is at t = 0."},
    {k:"T",sym:mi("t"),name:"time",unit:"s",val:p.T,why:"The moment the question asks about."}
  ],
  find:[
    {sym:mi("a"),name:"acceleration at that moment",unit:"m/s²",why:"Part (a)."},
    {sym:mi("v"),name:"velocity at that moment",unit:"m/s",why:"Part (b)."},
    {sym:mi("x"),name:"position at that moment",unit:"m",why:"Part (c)."}
  ],
  parts:[
    {id:"a",label:p=>`(a) Acceleration at t = ${p.T} s`,sym:mi("a"),unit:"m/s²",ans:(p,c)=>c.a,traps:(p,c)=>[
      [p.A-p.B,`That's the acceleration at t = 1 s. Put t = ${p.T} into ${p.A}t − ${p.B}.`],
      [p.A*p.T,`Don't forget the − ${p.B}: a = ${p.A} × ${p.T} − ${p.B}.`],
      [p.A*p.T+p.B,`Check the sign. It's ${p.A} × ${p.T} minus ${p.B}.`]
    ]},
    {id:"v",label:p=>`(b) Velocity at t = ${p.T} s`,sym:mi("v"),unit:"m/s",ans:(p,c)=>c.v,traps:(p,c)=>[
      p.v0?[c.v-p.v0,`You forgot the starting velocity. Add ${V0} = ${p.v0} m/s at the end.`]:null,
      [p.v0+c.a*p.T,`That's v₀ + a·t with the acceleration at the end (it's also what you get if you wrote ${p.A}t² instead of ${fmt(p.A/2)}t²). The acceleration keeps changing, so integrate each term: ${p.A}t → ${fmt(p.A/2)}t² and −${p.B} → −${p.B}t.`],
      [c.a,"That's the acceleration at that moment. The question asks for the velocity, so integrate a(t) first."]
    ].filter(Boolean)},
    {id:"x",label:p=>`(c) Position at t = ${p.T} s`,sym:mi("x"),unit:"m",ans:(p,c)=>c.x,traps:(p,c)=>[
      p.x0?[c.x-p.x0,`You forgot the starting position. Add ${X0} = ${p.x0} m.`]:null,
      p.v0?[c.x-p.v0*p.T,`You forgot the ${p.v0}t term. The starting velocity ${p.v0} integrates to ${p.v0}t.`]:null,
      [p.x0+c.v*p.T,`That's x₀ + v·t with the velocity at the end (it's also what you get if you don't divide the powers). The velocity keeps changing, so integrate each term of v(t): ${fmt(p.A/2)}t² → ${fmt(p.A/6)}t³ and −${p.B}t → −${fmt(p.B/2)}t².`],
      [c.v,"That's the velocity. Position needs one more integration step."]
    ].filter(Boolean)}
  ],
  idea:(p,c)=>`<p>When the acceleration changes, the simple formulas don't work. Go step by step instead:</p>
    <ol class="plain">
      <li><b>(a)</b> Acceleration: just put t = ${p.T} into the formula.</li>
      <li><b>(b)</b> Velocity: acceleration is how fast the velocity changes. To go backwards from a to v, ask for each term: <b>"what has this as its derivative?"</b> Then add the starting velocity.</li>
      <li><b>(c)</b> Position: velocity is how fast the position changes. Do the same again with your v(t), then add the starting position.</li>
    </ol>
    <p>Derivative reminder: bring the power down in front and lower it by 1. So t² → 2t, t³ → 3t², t → 1, and a plain number → 0.</p>
    <p class="small">Try it now. The next hint shows the rule for going backwards.</p>`,
  formula:()=>EQ(`${mi("v")}(${TT})${OP("=")}${V0}${OP("+")}${INT}${mi("a")}${OP("")}d${TT}${AND}${mi("x")}(${TT})${OP("=")}${X0}${OP("+")}${INT}${mi("v")}${OP("")}d${TT}`)+
    `<p>Going backwards, term by term ("what has this derivative?"):</p>
    <div class="tbl-wrap"><table class="tbl"><tr><th scope="row">Term you have</th><td>a number ${mi("k")}</td><td>${mi("k")}${TT}</td><td>${mi("k")}${sq2(TT)}</td></tr>
    <tr><th scope="row">Becomes</th><td>${mi("k")}${TT}</td><td>${FR(mi("k"),"2")}${sq2(TT)}</td><td>${FR(mi("k"),"3")}${TT}<sup>3</sup></td></tr></table></div>`+
    legend([[mi("a"),"acceleration","m/s²"],[mi("v"),"velocity","m/s"],[mi("x"),"position","m"],[V0,"velocity at t = 0","m/s"],[X0,"position at t = 0","m"],[TT,"time","s"]],
    `The rule: raise the power by 1, then divide by the new power. The ∫ … d${TT} just means "add up over time". You never calculate with the d${TT} itself.`),
  plug:(p,c)=>EQ(`${mi("v")}(${TT})${OP("=")}${poly(vT(p))}`)+EQ(`${mi("x")}(${TT})${OP("=")}${poly(xT(p))}`)+
    `<p>These are the two formulas after integrating. Check one yourself: the derivative of ${mi("v")}(${TT}) should give back ${poly(aT(p))}. Now put ${TT} = ${p.T} into each one.</p>`+
    calcTip(`${polyAt(vT(p),p.T).replace(/<sup>(\d)<\/sup>/g,"^$1").replace(/ × /g,"*").replace(/ − /g,"-").replace(/ \+ /g,"+").replace(/^−/,"-")}`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${mi("a")}(${TT}) = ${poly(aT(p))}, &nbsp;${V0} = ${p.v0} m/s, &nbsp;${X0} = ${p.x0} m, &nbsp;${TT} = ${p.T} s.`],
      ["(a) Put t into a(t)",CALC(`${mi("a")} = ${polyAt(aT(p),p.T)} = <b>${fmt(c.a)} m/s²</b>`)],
      ["Integrate a(t) term by term",CALC(`${p.A}${TT} → ${fmt(p.A/2)}${sq2(TT)}, &nbsp; −${p.B} → −${p.B}${TT}, &nbsp;so&nbsp; ${mi("v")}(${TT}) = ${poly(vT(p))}`)],

      let t=0;const rad=m=>7+7*Math.cbrt(m),TC=1.4;
      const place=(el,lab,x,rr)=>{el.setAttribute("cx",x.toFixed(1));el.setAttribute("cy",(100-rr).toFixed(1));el.setAttribute("r",rr.toFixed(1));lab.setAttribute("x",x.toFixed(1));lab.setAttribute("y",(100-2*rr-5).toFixed(1));};

      r.addEventListener("input",upd);upd();
      if(ctx.reduceMotion){t=3;draw();}else ctx.loop(dt=>{t+=dt;if(t>4.2)t=0;draw();});
    }
  }

  takeaway:"Power is work per second. Use P = W ÷ t for energy delivered over a time, and P = F × v for a force pushing at a speed.",
  link:"No homework on power yet, but it's on your course list right next to work and energy. It builds on HW 2, task 1: there you found the work done by a force, and power is that work per second.",
  viz:viz.slider((p,c)=>({
    note:`Same car, same final speed of ${p.v} m/s. The quicker you want to get there, the more power you need.`,
    label:`Time to reach ${p.v} m/s`,unit:"s",min:2,max:20,step:1,value:p.t,
    bars:[{label:"Average power needed (full bar = reaching it in 2 s)",segs:[{cls:"seg-ke",frac:x=>2/x}]}],
    read:x=>`In ${fmt(x)} s: ${PA} = ${fmt(c.W)} J ÷ ${fmt(x)} s = <b>${fmt(c.W/x)} W</b> (${fmt(c.W/x/1000)} kW)`

/* ===== 3. Conservation of angular momentum ===== */
{
  id:"q3", topic:"Angular momentum", hw:"Course topic: conservation of angular momentum",
  base:{I1:4,w1:1.5,I2:1.6},
  random:()=>{const r=pick([[4,1.5,1.6],[3,1.5,1],[5,2.5,2],[6,1,1.5],[2.4,2.5,0.8],[4.5,3,1.8]]);return {I1:r[0],w1:r[1],I2:r[2]};},
  calc:p=>{const L=p.I1*p.w1,w2=L/p.I2,K1=0.5*p.I1*p.w1*p.w1,K2=0.5*p.I2*w2*w2;return {L,w2,K1,K2,dK:K2-K1};},
  text:(p,G,T)=>`A student sits on a stool that can ${T("free","spin freely")}, holding a weight in each outstretched hand. Together, the student, stool and weights have a ${T("moi","moment of inertia")} of ${G("I1",`${p.I1} kg·m²`)} and spin at ${G("w1",`${p.w1} rad/s`)}. She pulls the weights in to her chest, which lowers the moment of inertia to ${G("I2",`${p.I2} kg·m²`)}. (a) What is the ${T("angmom","angular momentum")} before she pulls them in? (b) How fast does she spin afterwards? (c) By how much does the rotational kinetic energy increase?`,
  terms:{
    free:["Spin freely","No friction in the stool, so nothing from outside twists her. That means her angular momentum can't change."],
    moi:["Moment of inertia","The spinning version of mass: how hard it is to change how fast something rotates. Mass far from the axis counts more. Measured in kg·m²."],
    angmom:["Angular momentum","The spinning version of momentum: moment of inertia × angular velocity. Measured in kg·m²/s."]
  },
  given:p=>[
    {k:"I1",sym:I1,name:"moment of inertia before",unit:"kg·m²",val:p.I1,why:"Arms out, weights far from the axis.",look:"It's the first moment of inertia in the question."},
    {k:"w1",sym:W1,name:"angular velocity before",unit:"rad/s",val:p.w1,why:"How fast she spins with her arms out."},
    {k:"I2",sym:I2,name:"moment of inertia after",unit:"kg·m²",val:p.I2,why:"Weights pulled in, closer to the axis, so it's smaller.",look:"It's the second moment of inertia in the question."}
  ],
  find:[
    {sym:LA,name:"angular momentum",unit:"kg·m²/s",why:"Part (a)."},
    {sym:W2,name:"angular velocity after",unit:"rad/s",why:"Part (b)."},
    {sym:DKR,name:"increase in rotational kinetic energy",unit:"J",why:"Part (c)."}
  ],
  parts:[
    {id:"L",label:"(a) Angular momentum before",sym:LA,unit:"kg·m²/s",ans:(p,c)=>c.L,traps:(p,c)=>clean([
      [c.K1,"That's the kinetic energy (½Iω²). Angular momentum is L = I × ω."],
      [p.I1*p.w1*p.w1,"Don't square ω: L = I × ω."],
      [p.I2*p.w1,"Use the moment of inertia from before she pulls the weights in."]
    ],c.L)},
    {id:"w2",label:"(b) Angular velocity afterwards",sym:W2,unit:"rad/s",ans:(p,c)=>c.w2,traps:(p,c)=>clean([
      [p.w1*p.I2/p.I1,"Upside down. A smaller moment of inertia means a faster spin: ω₂ = I₁ω₁ ÷ I₂."],
      [p.w1,"She speeds up when she pulls the weights in, because L = Iω has to stay the same."],
      [p.w1*Math.sqrt(p.I1/p.I2),"That assumes the kinetic energy stays the same. It doesn't, because her arms do work. Angular momentum is what stays the same."],
      [c.L*p.I2,"Divide by I₂, don't multiply: ω₂ = L ÷ I₂."]
    ],c.w2)},
    {id:"dK",label:"(c) Increase in rotational kinetic energy",sym:DKR,unit:"J",ans:(p,c)=>c.dK,traps:(p,c)=>clean([
      [c.K2,"That's the energy afterwards. Subtract the energy before."],
      [c.K1,"That's the energy before. Work out ½Iω² afterwards too, and subtract."],
      [0,"Kinetic energy isn't conserved here: she does work pulling the weights in. Work out ½Iω² before and after."],
      [0.5*p.I2*(c.w2-p.w1)**2,"Work out ½Iω² before and after separately, then subtract. Don't square the change in ω."]
    ],c.dK)}
  ],
  idea:(p,c)=>`<p><b>Angular momentum</b> = moment of inertia × angular velocity. When nothing outside twists a spinning object, its angular momentum <b>stays the same</b>. It's the spinning version of momentum conservation from the collision questions.</p>
    <ul class="plain">
      <li><b>(a)</b> Multiply the starting moment of inertia by the starting angular velocity.</li>
      <li><b>(b)</b> Pulling the weights in moves mass closer to the axis, so the moment of inertia goes down. To keep I × ω the same, ω has to go up. That's how ice skaters spin faster when they pull their arms in.</li>
      <li><b>(c)</b> Work out the kinetic energy ½Iω² before and after, and subtract. It goes up: the extra energy comes from her muscles pulling the weights inward.</li>
    </ul>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${LA}${OP("=")}${mi("I")}${OMEGA}`)+
    EQ(`${I1}${W1}${OP("=")}${I2}${W2}${IMPLIES}${W2}${OP("=")}${FR(`${I1}${W1}`,I2)}`)+
    EQ(`${DKR}${OP("=")}${HALF}${I2}${sq2(W2)}${OP("−")}${HALF}${I1}${sq2(W1)}`)+
    legend([[LA,"angular momentum","kg·m²/s"],[mi("I"),"moment of inertia","kg·m²"],[OMEGA,"angular velocity","rad/s"],[KER,"rotational kinetic energy","J"]],
    `Compare with straight-line motion: momentum p = mv is conserved in collisions, and angular momentum L = Iω is conserved when nothing outside twists the object.`),
  plug:(p,c)=>EQ(`${LA}${OP("=")}${p.I1}${OP("×")}${p.w1}`)+
    EQ(`${W2}${OP("=")}${FR(`${p.I1}${OP("×")}${p.w1}`,p.I2)}`)+
    EQ(`${DKR}${OP("=")}${HALF}${OP("×")}${p.I2}${OP("×")}${sq2(W2)}${OP("−")}${HALF}${OP("×")}${p.I1}${OP("×")}${sq2(p.w1)}`)+
    `<p>Use your ${W2} from (b) in (c). Square the angular velocities before multiplying.</p>`+calcTip(`${p.I1}*${p.w1}/${p.I2}`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${I1} = ${p.I1} kg·m², &nbsp;${W1} = ${p.w1} rad/s, &nbsp;${I2} = ${p.I2} kg·m².`],
      ["(a) Angular momentum",CALC(`${LA} = ${I1}${W1} = ${p.I1} × ${p.w1} = <b>${fmt(c.L)} kg·m²/s</b>`)],
      ["(b) Angular momentum stays the same",CALC(`${W2} = ${LA} ÷ ${I2} = ${fmt(c.L)} ÷ ${p.I2} = <b>${fmt(c.w2)} rad/s</b>`)],
      ["Kinetic energy before and after",CALC(`before: ½ × ${p.I1} × ${sq2(p.w1)} = ${fmt(c.K1)} J, &nbsp; after: ½ × ${p.I2} × ${sq2(fmt(c.w2))} = ${fmt(c.K2)} J`)],
      ["(c) Subtract",CALC(`${DKR} = ${fmt(c.K2)} − ${fmt(c.K1)} = <b>${fmt(c.dK)} J</b>`)]
    ])+checkline(`Check: ${p.I2} × ${fmt(c.w2)} = ${fmt(p.I2*c.w2)} kg·m²/s, the same angular momentum as before ✓<br>Sense check: she spins faster (${fmt(c.w2)} > ${p.w1} rad/s) and her energy goes up, because her arms did work ✓`)+
    finalAns(`${LA} = ${fmt(c.L)} kg·m²/s, &nbsp;${W2} = ${fmt(c.w2)} rad/s, &nbsp;${DKR} = ${fmt(c.dK)} J`),
  sheet:[
    {name:"Angular momentum",eq:`${LA}${OP("=")}${mi("I")}${OMEGA}`,note:"The spinning version of p = mv."},
    {name:"Conservation of angular momentum",eq:`${I1}${W1}${OP("=")}${I2}${W2}`,note:"When nothing outside twists it. Kinetic energy can still change."}
  ],
  takeEq:()=>`${I1}${W1}${OP("=")}${I2}${W2}`,
  takeaway:"With no outside twist, L = Iω stays the same: a smaller moment of inertia means a faster spin. Kinetic energy is not conserved, because pulling in takes work.",
  link:"No homework on this yet, but conservation of angular momentum is on your course list. It's the spinning version of the momentum conservation you used in HW 1, task 3.",
  viz:{
    html:(p,c)=>`<p class="sec-note">Seen from above. Drag the weights in and out: the angular momentum stays at ${fmt(c.L)} kg·m²/s, so a smaller moment of inertia means a faster spin.</p>
      <div class="viz-box">
        <label class="viz-l" for="am-f">Weights: <output id="am-fo">all the way out</output></label>
        <input type="range" id="am-f" min="0" max="100" step="1" value="100">
        <svg class="vsvg" viewBox="0 0 400 220" role="img" aria-label="A spinning student seen from above">
          <circle cx="200" cy="110" r="100" class="v-faint"/>
          <g id="am-arms"></g>
          <circle cx="200" cy="110" r="22" style="fill:var(--blue-soft);stroke:var(--blue);stroke-width:2"/>
        </svg>
        <p class="viz-read" id="am-read"></p>
      </div>`,
    setup:(p,c,ctx)=>{
      const r=ctx.$("#am-f"),arms=ctx.$("#am-arms");let th=0;
      const state=()=>{const f=+r.value/100,I=p.I2+f*(p.I1-p.I2);return {f,I,w:c.L/I};};
      const draw=()=>{const s=state(),R=36+64*s.f;let g="";
        [0,Math.PI].forEach(o=>{const x=200+R*Math.cos(th+o),y=110+R*Math.sin(th+o);g+=`<line x1="200" y1="110" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--ink-2);stroke-width:4;stroke-linecap:round"/><circle class="v-block" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/>`;});
        arms.innerHTML=g;};
      const upd=()=>{const s=state();ctx.$("#am-fo").textContent=s.f>0.99?"all the way out":s.f<0.01?"pulled in":`${Math.round(s.f*100)}% of the way out`;
        ctx.$("#am-read").innerHTML=`I = ${fmt(R3(s.I))} kg·m², so ω = ${fmt(c.L)} ÷ ${fmt(R3(s.I))} = <b>${fmt(s.w)} rad/s</b>, and the kinetic energy is ½Iω² = ${fmt(0.5*s.I*s.w*s.w)} J`;draw();};
      r.addEventListener("input",upd);upd();
      if(!ctx.reduceMotion)ctx.loop(dt=>{th+=state().w*dt;draw();});
    }
  }
},

/* ===== 4. Parallel axis theorem ===== */
{
  id:"q4", topic:"Parallel axis theorem", hw:"Course topic: parallel axis theorem",
  base:{M:2,L:1.2,tau:2.4},
  random:()=>{const r=pick([[2,1.2,2.4],[3,1,2],[1.5,0.8,0.64],[4,0.6,1.44],[0.6,2,2],[2.4,1.5,3.6]]);return {M:r[0],L:r[1],tau:r[2]};},
  calc:p=>{const Icm=p.M*p.L*p.L/12,d=p.L/2,Iend=Icm+p.M*d*d;return {Icm,d,Iend,al:p.tau/Iend};},
  text:(p,G,T)=>`A thin, uniform ${T("rod","rod")} has a mass of ${G("M",`${p.M} kg`)} and a length of ${G("L",`${p.L} m`)}. (a) What is its moment of inertia about an axis through its centre, at 90° to the rod? (b) Use the ${T("pat","parallel axis theorem")} to find its moment of inertia about a parallel axis through one end. (c) A motor applies a ${T("torque","torque")} of ${G("tau",`${p.tau} N·m`)} to the rod about that end. What is the rod's ${T("angacc","angular acceleration")}?`,
  terms:{
    rod:["Uniform rod","A long thin stick with its mass spread evenly along its length."],
    pat:["Parallel axis theorem","A shortcut for the moment of inertia about any axis, if you already know it about a parallel axis through the centre of mass."],
    torque:["Torque","The spinning version of force: a twist. Measured in newton-metres (N·m)."],
    angacc:["Angular acceleration","How fast the angular velocity changes, in rad/s². The spinning version of acceleration."]
  },
  given:p=>[
    {k:"M",sym:MM,name:"mass",unit:"kg",val:p.M,why:"The mass of the rod."},
    {k:"L",sym:LL,name:"length",unit:"m",val:p.L,why:"End to end."},
    {k:"tau",sym:TAU,name:"torque",unit:"N·m",val:p.tau,why:"The twist from the motor in part (c). τ is the Greek letter tau."}
  ],
  find:[
    {sym:ICM,name:"moment of inertia about the centre",unit:"kg·m²",why:"Part (a). cm means centre of mass."},
    {sym:IEND,name:"moment of inertia about one end",unit:"kg·m²",why:"Part (b)."},
    {sym:AL,name:"angular acceleration",unit:"rad/s²",why:"Part (c). α is the Greek letter alpha."}
  ],
  parts:[
    {id:"Icm",label:"(a) Moment of inertia about the centre",sym:ICM,unit:"kg·m²",ans:(p,c)=>c.Icm,traps:(p,c)=>clean([
      [p.M*p.L*p.L,"ML² would mean all the mass sits a whole length L from the axis. For a rod about its centre it's (1/12)ML²."],
      [p.M*p.L*p.L/3,"(1/3)ML² is for the axis through the end. About the centre it's (1/12)ML²."],
      [p.M*p.L/12,"Square the length: (1/12) × M × L × L."],
      [p.M*p.L*p.L/2,"½ML² is a different shape (a solid cylinder uses ½MR²). A thin rod about its centre is (1/12)ML²."]
    ],c.Icm)},
    {id:"Iend",label:"(b) Moment of inertia about one end",sym:IEND,unit:"kg·m²",ans:(p,c)=>c.Iend,traps:(p,c)=>clean([
      [c.Icm+p.M*p.L*p.L,"The distance d is how far the axis moved, from the centre to the end. That's L/2, not L."],
      [c.Icm+p.M*c.d,"Square the distance: I = I_cm + M × d × d."],
      [p.M*c.d*c.d,"Add the moment of inertia about the centre too: I = I_cm + Md²."],
      [c.Icm,"Moving the axis away from the centre always makes the moment of inertia bigger. Add Md²."]
    ],c.Iend)},
    {id:"al",label:"(c) Angular acceleration about the end",sym:AL,unit:"rad/s²",ans:(p,c)=>c.al,traps:(p,c)=>clean([
      [p.tau/c.Icm,"Use the moment of inertia about the axis the rod actually turns around: the end, from (b)."],
      [p.tau*c.Iend,"Divide, don't multiply: α = τ ÷ I."],
      [c.Iend/p.tau,"Upside down: α = τ ÷ I."]
    ],c.al)}
  ],
  idea:(p,c)=>`<p>The moment of inertia depends on <b>where the axis is</b>. Mass far from the axis counts much more than mass close to it, because the distance gets squared.</p>
    <ul class="plain">
      <li><b>(a)</b> A thin rod spinning about its middle has a standard formula: you need the mass and the length squared, with a small fraction in front (next hint).</li>
      <li><b>(b)</b> Moving the axis from the middle to the end puts more of the rod far from the axis, so the moment of inertia gets bigger. The parallel axis theorem tells you by how much: add the mass × (how far you moved the axis)².</li>
      <li><b>(c)</b> Newton's second law for rotation: torque = moment of inertia × angular acceleration. Use the moment of inertia about the axis the rod actually turns around.</li>
    </ul>
    <p class="small">Try it now. The next hint gives you the formulas.</p>`,
  formula:()=>EQ(`${ICM}${OP("=")}${ONE12}${MM}${sq2(LL)}`)+
    EQ(`${mi("I")}${OP("=")}${ICM}${OP("+")}${MM}${sq2(DD)}${AND}${DD}${OP("=")}${FR(LL,"2")}`)+
    EQ(`${TAU}${OP("=")}${mi("I")}${AL}${IMPLIES}${AL}${OP("=")}${FR(TAU,mi("I"))}`)+
    legend([[ICM,"moment of inertia about the centre","kg·m²"],[MM,"mass","kg"],[LL,"length","m"],[DD,"distance between the two axes","m"],[TAU,"torque","N·m"],[AL,"angular acceleration","rad/s²"]],
    `The parallel axis theorem only works when you start from the axis through the centre of mass, and the new axis is parallel to it. A shortcut you can check with: a rod about its end is (1/3)${MM}${sq2(LL)}.`),
  plug:(p,c)=>EQ(`${ICM}${OP("=")}${ONE12}${OP("×")}${p.M}${OP("×")}${sq2(p.L)}`)+
    EQ(`${IEND}${OP("=")}${ICM}${OP("+")}${p.M}${OP("×")}${sq2(fmt(c.d))}`)+
    EQ(`${AL}${OP("=")}${FR(p.tau,IEND)}`)+
    `<p>Each answer feeds the next one.</p>`+calcTip(`${p.M}*${p.L}^2/12`),
  solution:(p,c)=>steps([
      ["Write down what you know",`${MM} = ${p.M} kg, &nbsp;${LL} = ${p.L} m, &nbsp;${TAU} = ${p.tau} N·m.`],
      ["(a) Rod about its centre",CALC(`${ICM} = (1/12) × ${p.M} × ${sq2(p.L)} = ${fmt(p.M*p.L*p.L)} ÷ 12 = <b>${fmt(c.Icm)} kg·m²</b>`)],
      ["Distance between the axes",CALC(`${DD} = ${LL} ÷ 2 = ${fmt(c.d)} m`)],
      ["(b) Parallel axis theorem",CALC(`${IEND} = ${fmt(c.Icm)} + ${p.M} × ${sq2(fmt(c.d))} = ${fmt(c.Icm)} + ${fmt(p.M*c.d*c.d)} = <b>${fmt(c.Iend)} kg·m²</b>`)],
      ["(c) Newton's second law for rotation",CALC(`${AL} = ${TAU} ÷ ${IEND} = ${p.tau} ÷ ${fmt(c.Iend)} = <b>${fmt(c.al)} rad/s²</b>`)]
    ])+checkline(`Shortcut check: (1/3)${MM}${sq2(LL)} = ${p.M} × ${sq2(p.L)} ÷ 3 = ${fmt(p.M*p.L*p.L/3)} kg·m², the same as (b) ✓<br>Sense check: ${IEND} is 4 times ${ICM}, so the same torque spins the rod 4 times more slowly about its end than about its centre.`)+
    finalAns(`${ICM} = ${fmt(c.Icm)} kg·m², &nbsp;${IEND} = ${fmt(c.Iend)} kg·m², &nbsp;${AL} = ${fmt(c.al)} rad/s²`),
  sheet:[
    {name:"Thin rod about its centre",eq:`${ICM}${OP("=")}${ONE12}${MM}${sq2(LL)}`,note:"About its end: (1/3)ML²."},
    {name:"Parallel axis theorem",eq:`${mi("I")}${OP("=")}${ICM}${OP("+")}${MM}${sq2(DD)}`,note:"d = distance from the centre-of-mass axis to the new parallel axis."}
  ],
  takeEq:()=>`${mi("I")}${OP("=")}${ICM}${OP("+")}${MM}${sq2(DD)}`,
  takeaway:"Moving the axis away from the centre of mass always adds Md² to the moment of inertia. Then τ = Iα about the axis it actually turns around.",
  link:"No homework on this yet, but the parallel axis theorem is on your course list under rotation. It extends HW 2, task 3, where the cylinders spun about their own centres.",
  viz:viz.slider((p,c)=>({
    note:"Slide the axis from the middle of the rod out to its end. The moment of inertia grows with the square of the distance.",
    label:"Axis distance from the centre",unit:"m",min:0,max:c.d,step:p.L/50,value:c.d,
    bars:[{label:"Moment of inertia (full bar = axis at the end)",segs:[{cls:"seg-alt",name:"I about the centre",frac:x=>c.Icm/c.Iend},{cls:"seg-ke",name:"extra M d²",frac:x=>p.M*x*x/c.Iend}]}],
    read:x=>`d = ${fmt(R3(x))} m: I = ${fmt(c.Icm)} + ${p.M} × ${sq2(fmt(R3(x)))} = <b>${fmt(c.Icm+p.M*x*x)} kg·m²</b>`
  }))
},

/* ===== 5. Energy in SHM ===== */
{
  id:"q5", topic:"SHM energy", hw:"Like HW 3, task 3",
  base:{m:0.5,k:200,Acm:10},
  random:()=>{const r=pick([[0.5,200,10],[2,50,20],[1,100,5],[0.8,80,12],[4,100,30],[0.2,20,8]]);return {m:r[0],k:r[1],Acm:r[2]};},
  calc:p=>{const A=p.Acm/100,w=Math.sqrt(p.k/p.m);return {A,E:0.5*p.k*A*A,xh:A/Math.SQRT2,w,T:2*Math.PI/w,t:Math.PI/(4*w)};},
  text:(p,G,T)=>`A ${G("m",`${p.m} kg`)} block on a spring (${T("k","spring constant")} ${G("k",`${p.k} N/m`)}) oscillates in simple harmonic motion with an ${T("amp","amplitude")} of ${G("A",`${p.Acm} cm`)}. (a) What is the total energy of the oscillation? (b) How far from the equilibrium position is the block when its ${T("pe","potential energy")} is exactly half of the total energy? Answer in metres. (c) How long does the block take to travel from the equilibrium position to that point?`,
  terms:{
    k:["Spring constant","How stiff the spring is, in newtons per metre of stretch."],
    amp:["Amplitude","The farthest the block gets from the middle. There it stops for an instant before coming back."],
    pe:["Potential energy (spring)","Energy stored in the stretched or squashed spring. It's biggest at the ends of the motion and zero in the middle."]
  },
  given:p=>[
    {k:"m",sym:mi("m"),name:"mass",unit:"kg",val:p.m,why:"The block's mass."},
    {k:"k",sym:mi("k"),name:"spring constant",unit:"N/m",val:p.k,why:"How stiff the spring is."},
    {k:"A",sym:AA,name:"amplitude",unit:"m",val:p.Acm/100,why:`The question gives ${p.Acm} cm. Divide by 100 for metres.`,look:`Start from the ${p.Acm} cm and divide by 100.`,gtraps:[[p.Acm,`${p.Acm} is in centimetres. Divide by 100 to get metres.`]]}
  ],
  find:[
    {sym:EE,name:"total energy",unit:"J",why:"Part (a)."},
    {sym:XX,name:"position where PE is half the total",unit:"m",why:"Part (b)."},
    {sym:mi("t"),name:"time from the middle to that point",unit:"s",why:"Part (c)."}
  ],
  parts:[
    {id:"E",label:"(a) Total energy",sym:EE,unit:"J",ans:(p,c)=>c.E,traps:(p,c)=>clean([
      [p.k*c.A*c.A,"You're missing the ½: E = ½kA²."],
      [0.5*p.k*c.A,"Square the amplitude: ½ × k × A × A."],
      [0.5*p.k*p.Acm*p.Acm,"The amplitude must be in metres. Divide the centimetres by 100 first."],
      [0.5*p.m*c.A*c.A,"Use the spring constant k, not the mass: E = ½kA²."]
    ],c.E)},
    {id:"x",label:"(b) Where the potential energy is half the total",sym:XX,unit:"m",ans:(p,c)=>c.xh,traps:(p,c)=>clean([
      [c.A/2,"Not halfway! Potential energy grows with x squared, so at x = A/2 it's only a quarter of the total. Set ½kx² = ½ × ½kA², which gives x = A ÷ √2."],
      [c.A,"That's the end of the motion, where all the energy is potential energy."],

const S7=(function(){
const {fmt,pick,mi,up,sb,OP,FR,SQ,EQ,CALC,HALF,sq2,IMPLIES,AND,PI,OMEGA,legend,steps,checkline,finalAns,calcTip}=HL;
const clean=(list,ans)=>list.filter(t=>t&&Number.isFinite(t[0])&&Math.abs(t[0]-ans)>0.03*Math.abs(ans)+1e-9);
const R3=n=>Math.round(n*1000)/1000;
const BETA=mi("β"),A0=sb(mi("A"),"0"),AA=mi("A"),W0=sb(OMEGA,"0"),LAM=mi("λ"),F0=sb(mi("F"),"0"),T0=sb(mi("T"),"0"),DE=up("Δ")+mi("E");
const EXP=x=>`${mi("e")}<sup>${x}</sup>`;
const FRES=sb(mi("f"),"res"),ARES=sb(mi("A"),"res"),AHALF=sb(mi("A"),"½");

/* plot of a decaying oscillation with a slider for the damping coefficient */
const dampViz=o=>({
  html:(p,c)=>{const q=o(p,c);return `<p class="sec-note">${q.note}</p>
    <div class="viz-box">
      <label class="viz-l" for="dz-s">Damping coefficient β: <output id="dz-so">${fmt(q.value)}</output> s⁻¹</label>
      <input type="range" id="dz-s" min="0" max="${q.max}" step="${q.step}" value="${q.value}">
      <svg class="vsvg" viewBox="0 0 400 180" role="img" aria-label="Graph of a damped oscillation">
        <line x1="20" y1="90" x2="390" y2="90" style="stroke:var(--rule);stroke-width:1"/>
        <line x1="20" y1="12" x2="20" y2="168" style="stroke:var(--rule);stroke-width:1"/>
        <path id="dz-e1" class="v-faint"/><path id="dz-e2" class="v-faint"/>
        <path id="dz-c" class="v-main" style="stroke-width:2"/>
        <text class="v-text" x="390" y="178" text-anchor="end">time →</text>
      </svg>
      <p class="viz-read" id="dz-read"></p>
    </div>`;},
  setup:(p,c,ctx)=>{const q=o(p,c),r=ctx.$("#dz-s"),X=t=>20+370*t/q.tMax,Y=y=>90-74*y;
    const path=f=>{let d="";for(let i=0;i<=360;i++){const t=q.tMax*i/360;d+=(i?" L":"M")+X(t).toFixed(1)+","+Y(f(t)).toFixed(1);}return d;};
    const upd=()=>{const b=+r.value;ctx.$("#dz-so").textContent=fmt(R3(b));
      ctx.$("#dz-c").setAttribute("d",path(t=>q.curve(b,t)));ctx.$("#dz-e1").setAttribute("d",path(t=>Math.exp(-b*t)));ctx.$("#dz-e2").setAttribute("d",path(t=>-Math.exp(-b*t)));
      ctx.$("#dz-read").innerHTML=q.read(b);};
    r.addEventListener("input",upd);upd();}
});
